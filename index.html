<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Démo Carte de Tarification</title>
  <link rel="stylesheet" href="./pricing-card.css" />
</head>
<body>
  <main>
    <h1 style="text-align:center; margin-top: 12px;">Nos offres</h1>
    <div id="plans"></div>
  </main>

  <script src="./pricing-card.js"></script>
  <script>
    const demoPlans = [
      {
        title: "Forfait de base",
        price: "9,99",
        currency: "$",
        period: "mois",
        features: [
          "1 Go de stockage",
          "Assistance de base",
          "Toutes les fonctionnalités principales"
        ],
        ctaLabel: "Démarrer l'essai",
        onClick: (plan) => alert(`Vous avez choisi: ${plan.title}`)
      },
      {
        title: "Forfait Pro",
        price: "19,99",
        currency: "$",
        period: "mois",
        features: [
          "10 Go de stockage",
          "Assistance prioritaire",
          "Fonctionnalités avancées"
        ],
        ctaLabel: "Choisir Pro",
        onClick: (plan) => alert(`Vous avez choisi: ${plan.title}`)
      },
      {
        title: "Forfait Entreprise",
        price: "Contact",
        currency: "",
        period: "",
        features: [
          "Stockage illimité",
          "Gestionnaire dédié",
          "SLA et sécurité avancée"
        ],
        ctaLabel: "Nous contacter",
        onClick: (plan) => alert(`Nous vous contacterons au sujet de: ${plan.title}`)
      }
    ];

    renderPricingCards('#plans', demoPlans);
  </script>
  <noscript>Activez JavaScript pour voir les cartes de tarification.</noscript>
</body>
</html>
